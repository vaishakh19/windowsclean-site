name: Site payment flow tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [windows-clean-launch-readiness]

jobs:
  payment-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
